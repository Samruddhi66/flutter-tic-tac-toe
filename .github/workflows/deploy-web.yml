name: Deploy web game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the web platform folder
        run: |
          flutter create --project-name tic_tac_toe --platforms=web /tmp/webapp
          cp -R /tmp/webapp/web .

      - name: Set the page title
        run: |
          sed -i 's|<title>tic_tac_toe</title>|<title>Tic Tac Toe</title>|' web/index.html
          sed -i 's|"name": "tic_tac_toe"|"name": "Tic Tac Toe"|; s|"short_name": "tic_tac_toe"|"short_name": "Tic Tac Toe"|' web/manifest.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build the web release
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
