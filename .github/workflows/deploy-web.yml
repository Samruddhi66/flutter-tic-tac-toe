name: Build the game and deploy it to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the Android release APK
        run: |
          flutter create --project-name tic_tac_toe --platforms=android .
          sed -i 's|android:label="tic_tac_toe"|android:label="Tic Tac Toe"|' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Build the web release
        run: |
          flutter create --project-name tic_tac_toe --platforms=web /tmp/webapp
          cp -R /tmp/webapp/web .
          sed -i 's|<title>tic_tac_toe</title>|<title>Tic Tac Toe</title>|' web/index.html
          sed -i 's|"name": "tic_tac_toe"|"name": "Tic Tac Toe"|; s|"short_name": "tic_tac_toe"|"short_name": "Tic Tac Toe"|' web/manifest.json
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Put the APK on the site so it can be downloaded
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/tic-tac-toe.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
